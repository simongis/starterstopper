name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Example config is valid
        run: python -c "import json,sys; sys.path.insert(0,'src'); from starterstopper import config; config.from_dict(json.load(open('config.example.json')))"
      - name: Leak check (tracked files)
        run: python tools/check_sanitised.py --all
